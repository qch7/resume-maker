name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 英文 Windows runner 默认使用 cp1252，显式启用 UTF-8 以输出中文检查报告
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm --prefix frontend ci
      - name: Check Python architecture and comments
        run: uv run --locked python scripts/check_quality.py
      - name: Lint Python
        run: uv run --locked ruff check src tests scripts
      - name: Check Python formatting
        run: uv run --locked ruff format --check src tests scripts
      - name: Test Python
        run: uv run --locked pytest -q
      - name: Check and test frontend
        run: npm --prefix frontend run check
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build installable wheel
        run: uv build --wheel
      - name: Verify installed wheel and bundled resources
        run: uv run --locked python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: resume-maker-${{ matrix.os }}
          path: dist/*.whl
