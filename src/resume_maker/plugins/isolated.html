<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>插件界面</title>
<div id="plugin-root"></div>
<script type="module" nonce="__NONCE__">
import { activate } from __ENTRY__;
let connected = false;
addEventListener("message", async (event) => {
  if (connected || event.source !== parent || event.data?.type !== "resume-plugin-connect"
      || event.ports.length !== 1) return;
  connected = true;
  const port = event.ports[0];
  const pending = new Map();
  const controller = new AbortController();
  let sequence = 0;
  port.onmessage = ({ data }) => {
    if (data?.type === "dispose") {
      controller.abort();
      for (const entry of pending.values()) entry.reject(new Error("插件已关闭"));
      pending.clear();
      port.close();
      return;
    }
    const entry = pending.get(data?.id);
    if (!entry) return;
    pending.delete(data.id);
    clearTimeout(entry.timer);
    data.ok ? entry.resolve(data.result) : entry.reject(new Error(data.error));
  };
  try {
    await activate({
      root: document.getElementById("plugin-root"),
      id: event.data.id,
      generation: event.data.generation,
      signal: controller.signal,
      request(method, payload) {
        if (controller.signal.aborted) return Promise.reject(new Error("插件已关闭"));
        if (pending.size >= 16) return Promise.reject(new Error("待处理请求过多"));
        const id = ++sequence;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error("插件请求超时"));
          }, 120000);
          pending.set(id, { resolve, reject, timer });
          port.postMessage({ id, method, payload });
        });
      },
    });
  } catch {
    document.getElementById("plugin-root").textContent = "插件界面启动失败";
  }
});
</script></html>
